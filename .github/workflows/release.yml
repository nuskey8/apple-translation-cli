name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64 --disable-automatic-resolution
          bin_dir=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          "$bin_dir/translate" --help
          lipo "$bin_dir/translate" -verify_arch arm64 x86_64
          mkdir -p dist
          cp "$bin_dir/translate" dist/translate
          cp LICENSE README.md dist/
          tar -czf translate-macos-universal.tar.gz -C dist translate LICENSE README.md
          shasum -a 256 translate-macos-universal.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" translate-macos-universal.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" translate-macos-universal.tar.gz SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
